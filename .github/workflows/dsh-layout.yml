name: dsh-layout

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DSH layout / tasks / changelog
        run: python3 tools/dsh_project.py layout check --ci
